<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulaire de devis</title></head>
<body>
<!-- Déclaration statique pour la détection Netlify Forms avec Next.js. -->
<form name="demande-de-devis" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input type="hidden" name="form-name" value="demande-de-devis">
  <input type="hidden" name="subject" value="Nouvelle demande de devis — Vert L’Horizon">
  <input name="bot-field">
  <input name="service">
  <input name="name">
  <input name="town">
  <input name="email" type="email">
  <input name="phone" type="tel">
  <textarea name="description"></textarea>
  <input type="file" name="photo-1">
  <input type="file" name="photo-2">
  <input type="file" name="photo-3">
  <input type="file" name="photo-4">
  <input type="file" name="photo-5">
</form>
<p>Merci. <a href="/">Retour à l’accueil</a></p>
</body>
</html>
